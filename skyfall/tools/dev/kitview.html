<!doctype html><html><body style="margin:0"><script type="module">
// Every variant of the given manifest kinds in a grid: ?k=tree,bush (nature) or ?p=crate,desk (props)
import * as THREE from 'three';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { assets } from '/src/client/assets.js';
import { STYLE } from '/src/client/comic.js';
STYLE.comic = false;
await assets.load();
const q = new URLSearchParams(location.search);
const list = [];
for (const k of (q.get('k') || '').split(',').filter(Boolean)) (assets.natureKinds(k) || []).forEach((v) => list.push([k, v]));
for (const k of (q.get('p') || '').split(',').filter(Boolean)) (assets.propKinds(k) || []).forEach((v) => list.push([k, v]));
const W = innerWidth, H = innerHeight, r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
r.setScissorTest(true);
const cols = Math.ceil(Math.sqrt(list.length * W / H)), rows = Math.ceil(list.length / cols), cw = W / cols, ch = H / rows;
const env = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
list.forEach(([k, v], i) => {
  const sc = new THREE.Scene(); sc.background = new THREE.Color('#aab4bc'); sc.environment = env;
  sc.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.5)); const d = new THREE.DirectionalLight(0xffffff, 2.5); d.position.set(3, 5, 4); sc.add(d);
  const g = new THREE.Group(); for (const p of v.parts) g.add(new THREE.Mesh(p.geometry, p.material)); sc.add(g);
  const b = new THREE.Box3().setFromObject(g), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3()), R = Math.max(s.x, s.y, s.z);
  const cam = new THREE.PerspectiveCamera(35, cw / ch, 0.01, 100); cam.position.set(c.x + R * 1.3, c.y + R * 0.6, c.z + R * 1.6); cam.lookAt(c);
  const x = (i % cols) * cw, y = H - (Math.floor(i / cols) + 1) * ch; r.setViewport(x, y, cw, ch); r.setScissor(x, y, cw, ch); r.render(sc, cam);
  const l = document.createElement('div'); l.textContent = k + ' ' + (v.def.node || v.def.file); Object.assign(l.style, { position: 'absolute', left: x + 4 + 'px', top: H - y - ch + 2 + 'px', font: '11px sans-serif' }); document.body.appendChild(l);
});
window.done = true;
</script></body></html>
