<!doctype html><html><body style="margin:0;background:#9aa"><script type="module">
import * as THREE from 'three';
import { assets } from '/src/client/assets.js';
await assets.load();
const q = new URLSearchParams(location.search), legend = q.get('l') || 'halo', states = (q.get('s') || 'idle,walk,run,crouch,slide,jump,death,heal').split(',');
const W = 1600, H = 900, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); document.body.appendChild(r.domElement);
r.setScissorTest(true);
const cols = 4, rows = Math.ceil(states.length / cols), cw = W / cols, ch = H / rows;
states.forEach((st, i) => {
  const sc = new THREE.Scene(); sc.background = new THREE.Color('#9aa6b0');
  sc.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.5)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2, 4, 3); sc.add(d);
  const c = assets.character(legend); sc.add(c.root);
  const clip = c.clips[st];
  if (clip) { const m = new THREE.AnimationMixer(c.model); m.clipAction(clip).play(); m.update(clip.duration * 0.35); }
  const cam = new THREE.PerspectiveCamera(35, cw / ch, 0.1, 50); cam.position.set(2.6, 1.3, 3.2); cam.lookAt(0, 0.9, 0);
  const x = (i % cols) * cw, y = H - (Math.floor(i / cols) + 1) * ch; r.setViewport(x, y, cw, ch); r.setScissor(x, y, cw, ch); r.render(sc, cam);
  const lbl = document.createElement('div'); lbl.textContent = st + ': ' + (clip ? clip.name : 'none'); Object.assign(lbl.style, { position: 'absolute', left: x + 6 + 'px', top: (H - y - ch) + 4 + 'px', font: '14px sans-serif' }); document.body.appendChild(lbl);
});
window.done = true;
</script></body></html>
