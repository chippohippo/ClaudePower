<!doctype html>
<html><head><meta charset="utf-8"><title>SKYFALL asset viewer</title>
<style>
  body { margin: 0; background: #1b1f26; color: #dfe6ee; font: 14px system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; left: 0; top: 0; bottom: 0; width: 300px; overflow: auto; background: rgba(10,12,16,0.85); padding: 10px; box-sizing: border-box; }
  #ui h3 { margin: 12px 0 4px; font-size: 12px; letter-spacing: 2px; color: #8a96a6; }
  #ui button { display: block; width: 100%; text-align: left; margin: 2px 0; padding: 5px 7px; background: #262c36; color: inherit; border: 0; cursor: pointer; }
  #ui button.on { background: #ff7a1a; color: #111; }
  #info { position: fixed; right: 10px; bottom: 10px; max-width: 480px; background: rgba(10,12,16,0.85); padding: 8px 10px; white-space: pre-wrap; font: 12px ui-monospace, monospace; }
  label { display: block; margin: 6px 0; }
</style></head>
<body>
<div id="ui">
  <b>SKYFALL asset viewer</b>
  <label><input type="checkbox" id="comic" checked> Comic (cel) look</label>
  <div id="list"></div>
</div>
<div id="info">Loading public/assets/manifest.json…</div>
<script type="module" src="./viewer.js"></script>
</body></html>
