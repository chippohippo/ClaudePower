<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>SKYFALL Dedicated Server</title>
<style>
  :root { --bg: #0b0f14; --panel: #131a22; --line: #2a3542; --text: #e8eef4; --muted: #8b97a5; --accent: #ff7a1a; --ok: #7dff9b; --warn: #ffcf5a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px 20px; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, 'Segoe UI', sans-serif; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: 3px; } h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; }
  .k { color: var(--muted); } .v b { user-select: text; }
  .ok { color: var(--ok); } .warn { color: var(--warn); }
  button { background: #1d2733; color: var(--text); border: 1px solid var(--line); padding: 6px 14px; font-weight: 700; letter-spacing: 1px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.35; cursor: default; border-color: var(--line); }
  button.copy { padding: 1px 8px; font-size: 11px; margin-left: 8px; }
  .row { display: flex; gap: 8px; margin: 12px 0; }
  pre { background: #070a0e; border: 1px solid var(--line); padding: 8px 10px; height: 190px; overflow: auto; margin: 0; font-size: 12px; color: #b9c4d0; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>SKY<span>FALL</span> DEDICATED SERVER</h1>
  <div class="sub">Players join from the game: ONLINE → enter one of the addresses below → CONNECT. Browsers can also open http://&lt;address&gt; to play.</div>
  <div class="grid" id="info"><div class="k">Status</div><div class="v">starting…</div></div>
  <div class="row"><button id="stop">STOP SERVER</button><button id="start">START SERVER</button><button id="quit">QUIT</button></div>
  <pre id="log"></pre>
<script>
  const D = window.skyfallDesktop;
  const port = +new URLSearchParams(location.search).get('port') || 3000;
  const $ = (s) => document.querySelector(s);
  const copy = (t) => `<button class="copy" data-copy="${t}">COPY</button>`;
  function render(h) {
    $('#stop').disabled = !(h && h.running);
    $('#start').disabled = !!(h && h.running);
    if (!h) { $('#info').innerHTML = '<div class="k">Status</div><div class="v warn">stopped</div>'; return; }
    if (h.error) { $('#info').innerHTML = `<div class="k">Status</div><div class="v warn">${h.error}</div>`; return; }
    const rows = [
      ['Status', h.running ? `<span class="ok">running</span> on port ${h.port}` : 'starting…'],
      ['Players', `${h.players || 0} connected · ${h.matches || 0} matches`],
      ['LAN', (h.lan || []).map((a) => `<b>${a}:${h.port}</b>${copy(`${a}:${h.port}`)}`).join('<br>') || '—'],
      ['Internet', h.publicIp ? `<b>${h.publicIp}:${h.port}</b>${copy(`${h.publicIp}:${h.port}`)}` : h.publicIp === false ? 'could not detect — search "what is my IP"' : 'looking up…'],
      ['Router (UPnP)', h.upnp === 'pending' ? 'opening port…' : h.upnp && h.upnp.ok ? '<span class="ok">port opened automatically</span>' : `<span class="warn">forward TCP ${h.port} to this PC${h.upnp && h.upnp.error ? ` — ${h.upnp.error}` : ''}</span>`],
    ];
    if (h.cgnat) rows.push(['Note', '<span class="warn">router WAN address ≠ public IP (carrier-grade NAT?) — internet players may not reach you</span>']);
    $('#info').innerHTML = rows.map(([k, v]) => `<div class="k">${k}</div><div class="v">${v}</div>`).join('');
    const log = $('#log'), atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
    log.textContent = (h.log || []).join('\n');
    if (atEnd) log.scrollTop = log.scrollHeight;
  }
  document.addEventListener('click', (e) => { const t = e.target.dataset && e.target.dataset.copy; if (t) D.copy(t); });
  $('#stop').onclick = () => D.stopHost().then(() => render(null));
  $('#start').onclick = () => D.host({ port }).then(render);
  $('#quit').onclick = () => D.quit();
  D.onHostEvent(render);
  D.hostStatus().then(render);
</script>
</body>
</html>
