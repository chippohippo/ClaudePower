; League of Legends — WASD mode, Marvel Rivals-style layout
; Copy to: C:\Riot Games\League of Legends\Config\input.ini  (back up the original first)
; Turn on WASD movement in the client first: Settings > Hotkeys > Movement.
; This file leaves movement (W/A/S/D) at the WASD-mode defaults.

[GameEvents]
; --- Abilities (Rivals: RMB secondary, Shift/E abilities, Q ultimate) ---
evtCastSpell1=[Button 2]
evtCastSpell2=[Shift]
evtCastSpell3=[e]
evtCastSpell4=[q]
evtSmartCastSpell1=[Button 2]
evtSmartCastSpell2=[Shift]
evtSmartCastSpell3=[e]
evtSmartCastSpell4=[q]

; --- Level up (Ctrl + ability key) ---
evtLevelSpell1=[Ctrl][Button 2]
evtLevelSpell2=[Ctrl][Shift]
evtLevelSpell3=[Ctrl][e]
evtLevelSpell4=[Ctrl][q]

; --- Summoner spells (Space = mobility, like Rivals jump/dash) ---
evtCastAvatarSpell1=[Space]
evtCastAvatarSpell2=[c]
evtSmartCastAvatarSpell1=[Space]
evtSmartCastAvatarSpell2=[c]

; --- Attack (LMB = primary fire) ---
evtPlayerAttackMoveClick=[Button 1]
evtPlayerAttackOnlyClick=[Button 1]

; --- Items / trinket ---
evtUseItem1=[1]
evtUseItem2=[2]
evtUseItem3=[3]
evtUseItem4=[z]
evtUseItem5=[x]
evtUseItem6=[v]
evtUseVisionItem=[f]
evtUseItem7=[4]

; --- Misc ---
evtOpenShop=[p]
evtShowScoreBoard=[Tab]
evtSelfCastAvatarSpell1=[Alt][Space]
evtCameraLockToggle=[y]
evtSelectSelf=[g]
evtCastRecall=[b]
