<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rig Lab</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font: 12px/1.45 system-ui, sans-serif; color: #e8e8e8; }
    #ui { position: fixed; left: 12px; right: 12px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
    #ui .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    #ui button { background: #0009; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 3px 7px; font: inherit; cursor: pointer; }
    #ui button.on { border-color: #ffcf6b; color: #ffcf6b; }
    #ui label { background: #0009; padding: 3px 7px; border-radius: 4px; display: flex; gap: 4px; align-items: center; }
    #info { position: fixed; left: 12px; bottom: 12px; background: #000a; padding: 8px 10px; border-radius: 6px; max-width: 560px; }
    #info pre { margin: 6px 0 0; font-size: 11px; color: #9fd3ff; }
    @media (max-width: 700px) { #ui button { padding: 2px 5px; font-size: 11px; } #info { right: 12px; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="ui"></div>
  <div id="info"></div>
  <script type="module" src="./src/tools/rigLab.js"></script>
</body>
</html>
